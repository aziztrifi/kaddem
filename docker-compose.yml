version: "3.7"
services:
  Kaddem:
    container_name: Kaddem
    build: ../5SAE3-G4-KADDEM-DevOps
    ports:
      - "8089:8089"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://dbmysql:3306/kaddem?createDatabaseIfNotExist=true&userSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
    restart: always

    image: ayoub12/kaddem-2
    depends_on:
      - dbmysql

  dbmysql:
    image: "mysql:5.6"
    container_name: dbmysql
    environment:
      - MYSQL_ROOT_PASSWORD=
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql
      
  angular-app:
    image: ayoub12/kaddem:latest  # Spécifiez le nom de votre image et la version (dans cet exemple, "latest")
    ports:
      - "4200:80"  # Assurez-vous que les ports correspondent à ceux que vous utilisez dans votre application
    restart: always  # Optionnel : redémarrer toujours le conteneur en cas d'échec



volumes:
  db:
