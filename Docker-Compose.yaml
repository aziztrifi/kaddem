version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3306:3306"
    restart: on-failure

  spring-app:
    image: azizhex/kaddem03app:v1.0
    container_name: spring-app-container
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kaddem?createDatabaseIfNotExist=true&useUnicode=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
    depends_on:
      - mysql
    restart: on-failure

  frontend:
    image: angular-frontend
    container_name: frontend-container
    ports:
      - "4200:80"  # Expose the frontend on port 4200
    depends_on:
      - spring-app
    restart: on-failure
